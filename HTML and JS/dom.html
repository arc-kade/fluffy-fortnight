<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Demo</title>
    <style>
        #box2{
            width: 200px;
            height: 100px;

            display: flex;

        }
        .box{
            width: 200px;

        }

    <h1 id="title">Welcome</h1>
    <p id="p1">This is paragraph 1</p>
    <!-- <p class="box">This is paragraph 2</p> -->

        <li>Mango</li>
        <li>Apple</li>
        <li>Banana</li>
    </ul>
    <h1 id="title1">Hello World</h1>

    <div>

    </div>
    <div class="box" id="mybox">This is a box</div>
    <button id="addButton">Add Item</button>
    <ul id="itemList">
        <li>Mango</li>
        <li>Apple</li>
    </ul>
    <button id="myButton">Click Me</button>
