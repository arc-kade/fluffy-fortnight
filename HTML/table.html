<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse;
        }
        table{
            width: 100%;
        }
        tr{
            height: 30px;
        }
        td{
            text-align: center;
        }
        th{
            background-color: bisque;
        }
        tr:nth-child(even){
            background-color: #cccccc;
        }
    </style>

</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Abilash</td>
            <td>23</td>
            <td>Mala</td>
        </tr>
        <tr>
            <td>Aswathi</td>
            <td>22</td>
            <td>Aluva</td>
        </tr>
        <tr>
            <td>Sunil</td>
            <td>24</td>
            <td>Chalakkudi</td>
        </tr>
    </table>
</body>
</html>
